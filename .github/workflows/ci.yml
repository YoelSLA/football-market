name: CI

on:
  push:
    branches:
      - dev

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.base_ref == 'dev' ||
      (github.base_ref == 'main' && github.head_ref == 'dev')
      

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: football_market_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d football_market_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and test
        working-directory: backend
        run: ./gradlew clean build --no-build-cache --rerun-tasks --stacktrace

      - name: Show test failure details
        if: always()
        working-directory: backend
        run: |
          echo "=== SCHEMA VALIDATION ERRORS ==="
          grep -R -A 20 -B 5 "Schema-validation" build/test-results/test || true

          echo ""
          echo "=== TEST REPORT FILES ==="
          find build/test-results/test -type f -maxdepth 1 -print || true

      - name: Inspect database schema
        if: always()
        env:
          PGPASSWORD: root
        run: |
          echo "=== DATABASE TABLES ==="
          psql \
            -h localhost \
            -U postgres \
            -d football_market_test \
            -c "\dt"

          echo ""
          echo "=== USERS TABLE ==="
          psql \
            -h localhost \
            -U postgres \
            -d football_market_test \
            -c "\d users"

          echo ""
          echo "=== FLYWAY HISTORY ==="
          psql \
            -h localhost \
            -U postgres \
            -d football_market_test \
            -c "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;"