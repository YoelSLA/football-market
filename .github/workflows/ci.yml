name: CI

on:
  push:
    branches:
      - dev

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.base_ref == 'dev' ||
      (github.base_ref == 'main' && github.head_ref == 'dev')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and test
        working-directory: backend
        run: ./gradlew clean build --no-build-cache --rerun-tasks --stacktrace

      - name: Show test failure details
        if: failure()
        working-directory: backend
        run: |
          echo "=== TEST REPORT FILES ==="
          find build/test-results/test -type f -maxdepth 1 -print || true

          echo ""
          echo "=== TEST FAILURES ==="
          grep -R -A 20 -B 5 \
            -E "failure|error|exception|Schema-validation" \
            build/test-results/test || true
