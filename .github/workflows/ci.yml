name: CI

on:
  push:
    branches:
      - dev

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/libs.versions.toml', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and test
        working-directory: backend
        env:
          CI: 'true'
        run: ./gradlew build --stacktrace

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-reports
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn

      - name: Show test failure details
        if: failure()
        working-directory: backend
        run: |
          echo "=== TEST REPORT FILES ==="
          find build/test-results/test -type f -maxdepth 1 -print || true

          echo ""
          echo "=== TEST FAILURES ==="
          grep -R -A 20 -B 5 \
            -E "failure|error|exception|Schema-validation" \
            build/test-results/test || true
