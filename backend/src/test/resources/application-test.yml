spring:
  datasource:
    hikari:
      data-source-properties:
        TimeZone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

football-data:
  api-key: test-only-not-a-credential
  base-url: https://provider.example/v4
  competitions: PL,BL1,PD,SA,FL1

jwt:
  secret: test-secret-key-for-football-market-2026
  expiration: 43200000

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.stat: OFF
