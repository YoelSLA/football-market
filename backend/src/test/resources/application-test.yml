spring:
  datasource:
    hikari:
      data-source-properties:
        TimeZone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

football-data:
  api-key: test-only-not-a-credential
  base-url: https://provider.example/v4
  competitions: PL,BL1,PD,SA,FL1

the-sports-db:
  api-key: test-only-not-a-credential
  base-url: https://provider.example/api/v1/json
  request-interval-ms: 2500
  max-retries: 3
  image-retry-days: 30

jwt:
  secret: test-secret-key-for-football-market-2026
  expiration: 43200000

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.stat: OFF

# Identidades sintéticas exclusivas de testing; cada suite funcional debe enlazar
# los IDs devueltos por el catálogo aislado antes de iniciar la sincronización.
whoscored:
  statistics:
    scraping-workers: 4
    json-workers: 3
    request-interval-ms: 1
    # El presupuesto del lote debe superar el ritmo por defecto de 60 s por jugador: si no, la
    # capacidad calculada limita el lote a un jugador y las pruebas de poblacion fallan.
    scraping-batch-timeout-ms: 1800000
    navigation-timeout-ms: 1000
    query-timeout-ms: 1000
    filter-third-party-resources: false
    headed: true
  base-url: https://provider.example
  user-agent: identity-test-client
  page-size: 3
  request-interval-ms: 1
  connect-timeout-ms: 5000
  read-timeout-ms: 20000
  max-pages-per-league: 10000
  max-response-bytes: 5242880
  competitions:
    - league-id: 900001
      tournament-id: 2
    - league-id: 900002
      tournament-id: 3
    - league-id: 900003
      tournament-id: 4
    - league-id: 900004
      tournament-id: 5
    - league-id: 900005
      tournament-id: 22
