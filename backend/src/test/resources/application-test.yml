spring:
  datasource:
    hikari:
      data-source-properties:
        TimeZone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

football-data:
  api-key: test-only-not-a-credential
  base-url: https://provider.example/v4
  competitions: PL,BL1,PD,SA,FL1

the-sports-db:
  api-key: test-only-not-a-credential
  base-url: https://provider.example/api/v1/json
  request-interval-ms: 2500
  max-retries: 3
  image-retry-days: 30

jwt:
  secret: test-secret-key-for-football-market-2026
  expiration: 43200000

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.stat: OFF

# Fuente de cotización para el entorno de pruebas.
#
# `BuyOrderServiceImpl` es un `@Service` obligatorio en todo contexto completo y requiere un
# `QuoteSource` por inyección de constructor. La fuente real de REQ-S2-03 todavía no existe, de
# modo que sin esta habilitación explícita cada `@SpringBootTest` falla al arrancar con
# `NoSuchBeanDefinitionException` antes incluso de ejecutar su primera prueba.
#
# El simulador se habilita aquí, y solo aquí: es el mecanismo previsto para los entornos de
# desarrollo y prueba, y la habilitación sigue siendo explícita y nominal. La prioridad de una
# fuente real se conserva intacta, porque `QuoteSimulationConfiguration` decide por presencia del
# bean y no por esta propiedad. Las pruebas que fijan un precio propio lo sustituyen con
# `@MockitoBean`.
market:
  quote:
    simulator:
      enabled: true
      price: 100
