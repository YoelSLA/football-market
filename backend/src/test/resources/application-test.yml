spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/football_market_test
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

    hikari:
      data-source-properties:
        TimeZone: UTC

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.stat: OFF