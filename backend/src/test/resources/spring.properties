# La campaña completa combina decenas de configuraciones de contexto distintas, y cada una abre
# su propio PostgreSQL de Testcontainers, su pool de conexiones y, cuando corresponde, su Tomcat.
# El valor por defecto (32) mantiene vivos demasiados contextos y agota el heap de la JVM de test
# en máquinas de 16 GB. Un límite menor obliga a Spring a cerrar los contextos evictos, liberando
# contenedores y pools, sin alterar el comportamiento de ningún test.
spring.test.context.cache.maxSize=8
