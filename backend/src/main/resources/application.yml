server:
  port: 8080

spring:
  profiles:
    active: dev

  application:
    name: football-market

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  jackson:
    time-zone: America/Argentina/Buenos_Aires

logging:
  level:
    root: INFO
    ar.edu.unq.schoolmanager: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.stat: OFF

the-sports-db:
  api-key: ${THE_SPORTS_DB_API_KEY}
  base-url: ${THE_SPORTS_DB_BASE_URL:https://www.thesportsdb.com/api/v1/json}
  request-interval-ms: ${THE_SPORTS_DB_REQUEST_INTERVAL_MS:2500}
  max-retries: ${THE_SPORTS_DB_MAX_RETRIES:3}
  image-retry-days: ${THE_SPORTS_DB_IMAGE_RETRY_DAYS:30}
  audit-retention-days: ${THE_SPORTS_DB_AUDIT_RETENTION_DAYS:}

# Aprovisionamiento de la cuenta singular SUPERUSER, propietario inicial de los tokens.
# Deshabilitado por defecto. Identidad y contraseña se proveen por el entorno de ejecución:
# el repositorio no declara credenciales ni valores por defecto. Si se habilita sin completar la
# configuración, el arranque falla de forma explícita.
footballmarket:
  superuser:
    enabled: ${SUPERUSER_ENABLED:false}
    username: ${SUPERUSER_USERNAME:}
    email: ${SUPERUSER_EMAIL:}
    password: ${SUPERUSER_PASSWORD:}
