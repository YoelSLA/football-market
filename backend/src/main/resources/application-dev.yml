spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/football_market_dev
    username: postgres
    password: root

    hikari:
      data-source-properties:
        TimeZone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        generate_statistics: false
        format_sql: false