spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/football_market_dev
    username: postgres
    password: root

    hikari:
      data-source-properties:
        TimeZone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: false
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 43200000

# Las demás propiedades y la clave de TheSportsDB se enlazan mediante application.yml.
the-sports-db:
  base-url: ${THE_SPORTS_DB_BASE_URL:https://www.thesportsdb.com/api/v1/json}
