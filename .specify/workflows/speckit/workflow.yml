schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "3.0.0"
  author: "GitHub"
  description: "SDD asistido: READY global, autorización de US, CODE REVIEW/TESTING humanos y autorización final de Feature tras CONVERGE"

# Orquestación asistida, no desatendida. Los gates exigen evidencia del
# docs/development/sdd-workflow.md; approve sin evidencia no completa fases.
# Una pasada Implement no cierra la SPEC: si quedan US, rechazar el gate final
# y retomarlas con encargos separados; no repetir Specify creando otra identidad.
# No escribe Trello por sí mismo ni autoriza sus operaciones; comandos sujetos a AGENTS.

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # Integración efectiva del proyecto; MUST comprobar disponibilidad de los
    # ocho comandos antes de usar el workflow. No declara compatibilidad probada
    # con otras integraciones ni reemplaza la validación del motor.
    any:
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]
  user_story:
    type: string
    default: ""
    prompt: "US formal existente (SPEC-nnn | USnn); dejar vacío si aún no existe, sin predecir identidad"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Acreditar Specify satisfactorio antes de Clarify; un archivo no es aprobación."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-clarifications
    type: gate
    message: "Acreditar Clarify sin decisiones fundamentales pendientes antes de Plan."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Acreditar Plan y Constitution Check antes de Checklists."
    options: [approve, reject]
    on_reject: abort

  - id: checklists
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "Evaluar calidad de requisitos en dominios aplicables a {{ inputs.spec }}; no tests de implementación."

  - id: review-checklists
    type: gate
    message: "El revisor debe evaluar checklists aplicables y registrar evidencia antes de Tasks; generar archivos no basta."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Acreditar cobertura, dependencias y desglose de US antes de Analyze."
    options: [approve, reject]
    on_reject: abort

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: ready-gate
    type: gate
    message: "MUST acreditar preparación global y Analyze vigente sin blockers de especificación/planificación/consistencia. Dependency ≠ Blocker. READY no autoriza IMPLEMENT. Si falta preparación, reject."
    options: [approve, reject]
    on_reject: abort

  - id: implementation-authorization
    type: gate
    message: "Usuario debe autorizar explícitamente US {{ inputs.user_story }} real y prerrequisitos seleccionados; persistir IMPLEMENT AUTHORIZATION en su tarjeta. Si US vacía/inexistente o evidencia no persistida, reject. Autorización no inicia IMPLEMENT: US permanece READY hasta inicio efectivo."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "Implementar únicamente {{ inputs.user_story }} y prerrequisitos explícitamente autorizados, alcance {{ inputs.scope }}. Seguir workflow local; no ejecutar tests."

  - id: code-review
    type: gate
    message: "Presentar Code Review Report completo de US {{ inputs.user_story }}, incluidos tests. Requiere aprobación humana inequívoca del checklist completo y evidencia persistida; agente no aprueba. Rechazo: abortar y corregir en encargo separado, luego nuevo review."
    options: [approve, reject]
    on_reject: abort

  - id: testing
    type: gate
    message: "Presentar Testing Report. Usuario revisa cobertura/tests, los ejecuta y confirma resultado satisfactorio, o valida explícitamente N/A justificado; persistir evidencia antes de US DONE. Agente no ejecuta tests. Si bloqueado/pendiente, reject y reanudar en encargo separado."
    options: [approve, reject]
    on_reject: abort

  - id: spec-implemented-gate
    type: gate
    message: "MUST acreditar todas las US requeridas DONE por CODE REVIEW/TESTING humanos vigentes y persistidos, trabajo necesario completo. Si quedan US, reject y continuar en encargos separados. Feature pasa TESTING final; no DONE."
    options: [approve, reject]
    on_reject: abort

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: feature-completion-authorization
    type: gate
    message: "CONVERGE exitoso y revisión complementaria preparan cierre, no autorizan DONE. Usuario debe dar FEATURE COMPLETION AUTHORIZATION explícita referida a Feature/resultado evaluado; persistirla antes de Approved/Feature DONE. El gate no escribe Trello por sí mismo ni acredita tests pendientes. Invalidaciones solo por impacto."
    options: [approve, reject]
    on_reject: abort
